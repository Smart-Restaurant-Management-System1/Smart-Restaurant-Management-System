server {
    listen 80;
    server_name localhost;

    # Azure Identity Service
    location /api/ {
        proxy_pass https://identity-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name identity-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_set_header Host identity-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Menu photo upload (SR-213). The API accepts files up to 5 MB; nginx's default request-body limit
    # is 1 MB, so this exact-match location raises the limit to 6m (5 MB plus multipart overhead).
    # Every other route keeps the default limit.
    location = /reservation-api/MenuItems/upload-image {
        client_max_body_size 6m;
        proxy_pass https://reservation-api.purpledesert-2900c071.eastasia.azurecontainerapps.io/api/MenuItems/upload-image;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name reservation-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_set_header Host reservation-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Azure Reservation Service
    location /reservation-api/ {
        proxy_pass https://reservation-api.purpledesert-2900c071.eastasia.azurecontainerapps.io/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name reservation-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_set_header Host reservation-api.purpledesert-2900c071.eastasia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
