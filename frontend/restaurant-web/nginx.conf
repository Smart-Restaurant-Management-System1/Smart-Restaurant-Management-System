server {
    listen 80;
    server_name localhost;

    # Identity Service
    location /api/ {
        proxy_pass http://identity-service:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Menu photo upload (SR-213). The API accepts files up to 5 MB; nginx's default request-body limit
    # is 1 MB, so this exact-match location raises the limit to 6m (5 MB plus multipart overhead).
    # Every other route keeps the default limit.
    location = /reservation-api/MenuItems/upload-image {
        client_max_body_size 6m;
        proxy_pass http://reservation-service:5000/api/MenuItems/upload-image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reservation Service
    location /reservation-api/ {
        proxy_pass http://reservation-service:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded Media / Dish Images (Served by Reservation Service)
    location /uploads/ {
        proxy_pass http://reservation-service:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
