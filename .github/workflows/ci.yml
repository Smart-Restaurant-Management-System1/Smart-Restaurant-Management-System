name: Cinnamon Bistro CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  repository-check:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository structure
        run: |
          echo "Cinnamon Bistro CI Pipeline"
          echo "Validating repository structure..."

          test -d frontend
          test -d backend
          test -d database
          test -d tests
          test -d docs
          test -d monitoring

          echo "Repository structure validated successfully."


  frontend:
    name: React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/restaurant-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend implementation
        id: frontend-check
        shell: bash
        run: |
          if [ -f "index.html" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "React application detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Frontend implementation is not available yet."
            echo "Build will be enabled when the React application is implemented."
          fi

      - name: Install frontend dependencies
        if: steps.frontend-check.outputs.ready == 'true'
        run: npm install

      - name: Build React frontend
        if: steps.frontend-check.outputs.ready == 'true'
        run: npm run build


  backend:
    name: ASP.NET Core Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Detect ASP.NET projects
        id: backend-check
        shell: bash
        run: |
          if find backend -name "*.csproj" -print -quit | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ASP.NET project files detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ASP.NET projects have not been implemented yet."
          fi

      - name: Restore backend dependencies
        if: steps.backend-check.outputs.ready == 'true'
        run: |
          find backend -name "*.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet restore "$project"
          done

      - name: Build backend projects
        if: steps.backend-check.outputs.ready == 'true'
        run: |
          find backend -name "*.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet build "$project" --configuration Release --no-restore
          done


  tests:
    name: xUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Detect test projects
        id: test-check
        shell: bash
        run: |
          # Browser E2E projects require a running frontend and APIs. They are
          # executed separately with that environment; this job is unit-test CI.
          if find tests/unit -name "*.csproj" -print -quit | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Test projects detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "xUnit test projects have not been implemented yet."
          fi

      - name: Run xUnit tests (unit + SR-113 contract + SR-112 publisher — no real broker needed)
        if: steps.test-check.outputs.ready == 'true'
        run: |
          find tests/unit -name "*.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet test "$project" --configuration Release
          done

  kafka-integration:
    name: SR-114 Kafka Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: restaurant_reservation_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Apply MySQL migrations
        run: |
          for f in $(ls database/reservation-db/*.sql | sort); do
            mysql -h 127.0.0.1 -P 3306 -u root -pci_test_password < "$f"
          done

      - name: Detect integration test projects
        id: integration-check
        shell: bash
        run: |
          if find tests/integration -name "*.csproj" -print -quit | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No integration test projects found — skipping."
          fi

      - name: Run SR-114 MySQL integration tests (Kafka end-to-end skipped — no broker in CI)
        if: steps.integration-check.outputs.ready == 'true'
        env:
          SR101_TEST_MYSQL: "Server=127.0.0.1;Port=3306;Database=restaurant_reservation_db;User=root;Password=ci_test_password;AllowPublicKeyRetrieval=True;SslMode=None;"
        run: |
          find tests/integration -name "*.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet test "$project" --configuration Release
          done
